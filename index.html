<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SECURITY: Pi-Compatible Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' https: blob: data:;
      script-src 'self' https://sdk.minepi.com 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https:;
      img-src 'self' https: data: blob:;
      font-src 'self' https: data:;
      connect-src 'self' https://api.minepi.com https://socialchain.app https:;
      frame-src https:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    " />

    <!-- Preconnect to external origins for faster loading -->
    <link rel="preconnect" href="https://sdk.minepi.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />

    <title>Avante Maps - Discover Local Businesses with Pi Network</title>

    <!-- Load Pi SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <script>
      // Sandbox detection: ONLY production domain uses sandbox: false
      // All other environments (localhost, preview, testnet) use sandbox: true
      const hostname = window.location.hostname;
      const isProduction = hostname === "avantemaps.com" || hostname.endsWith(".avantemaps.com");
      const isSandbox = !isProduction;

      // Initialize Pi SDK immediately when script loads (not on window.load)
      // This ensures Pi.init() is called before any authenticate() calls
      // IMPORTANT: This is the ONLY place Pi.init() should be called
      (function initPiSdk() {
        if (window.Pi) {
          console.log("🔧 Pi SDK Init:", { hostname, isProduction, sandbox: isSandbox });
          Pi.init({
            version: "2.0",
            sandbox: isSandbox,
          });
          window.__piInitialized = true;
          window.__piSandboxMode = isSandbox;
        } else {
          // Retry after a short delay if SDK isn't ready yet
          setTimeout(initPiSdk, 50);
        }
      })();
    </script>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Avante Maps - Local Business Discovery" />
    <meta name="description" content="Find and explore local businesses on Avante Maps. Register your business, get discovered by customers, and transact with Pi cryptocurrency." />
    <meta name="keywords" content="pi network, local businesses, business directory, cryptocurrency, pi payment, avante maps" />
    <meta name="author" content="Avante Maps Team" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://avantemaps.com/" />
    <meta property="og:title" content="Avante Maps - Discover Local Businesses" />
    <meta property="og:description" content="Find local businesses and pay with Pi Network cryptocurrency. Join the Pi business community." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:secure_url" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Avante Maps - Local Business Directory" />
    <meta property="og:site_name" content="Avante Maps" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AvanteMap" />
    <meta name="twitter:creator" content="@AvanteMap" />
    <meta name="twitter:title" content="Avante Maps - Discover Local Businesses" />
    <meta name="twitter:description" content="Find local businesses and pay with Pi Network cryptocurrency" />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Avante Maps Preview" />

    <!-- Leaflet Maps - Non-blocking CSS with print media swap -->
    <link 
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    </noscript>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      type="module"
    ></script>
  </head>

  <body>
    <div id="root"></div>

    <!-- IMPORTANT: DO NOT REMOVE THIS COMMENT OR TAG -->
    <script
      src="https://cdn.gpteng.co/gptengineer.js"
      type="module"
      defer
    ></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
